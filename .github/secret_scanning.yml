# GitHub secret scanning path exclusions.
#
# This repo's dataset generator deliberately produces realistic-looking
# fake credentials as training content: several seed tasks across the
# agentic_tool_use/general_code domains are literally "find hardcoded
# secrets in this repo" scenarios (schema_templates.py's
# EXAMPLE_JSON_INSTRUCTIONS explicitly asks for "real-sounding ... API
# keys" rather than generic placeholders). That's working as intended --
# the model needs realistic secret-shaped strings to learn to actually
# find them -- but it structurally trips GitHub's pattern-based secret
# scanner on every such example, blocking otherwise-legitimate pushes of
# the generated dataset (see STATUS.md section 4 for the incident that
# prompted this). These paths hold only generated synthetic training
# data, never real credentials (real keys live in the gitignored .env,
# which is never committed) -- excluded here rather than allowlisting
# each fake secret one at a time as new examples get generated.
paths-ignore:
  - "data/raw/**"
  - "data/raw_2_2/**"
  - "data/train.jsonl"
  - "data/eval.jsonl"
  - "data/train_2_2.jsonl"
  - "data/eval_2_2.jsonl"
  - "data/train_*.jsonl"
  - "data/eval_*.jsonl"
